<script>
const state={page:'quickRegister',mode:'list',tab:'机构信息',editing:false,campusEdit:null,staffEdit:null,campuses:[{name:'城中校区',rooms:8,seats:180,active:true,address:'江苏省 苏州市 姑苏区 人民路18号',merchant:'苏州思跃教育科技有限公司'},{name:'园区校区',rooms:5,seats:120,active:true,address:'江苏省 苏州市 工业园区 星湖街66号',merchant:'苏州思跃教育科技有限公司'},{name:'新区校区',rooms:3,seats:75,active:false,address:'江苏省 苏州市 虎丘区 长江路28号',merchant:'未绑定'}],staff:[{name:'袁老师',phone:'130****3533',gender:'男',campus:'城中校区',roles:'前台、教务、面授主讲',active:true},{name:'陈老师',phone:'138****6281',gender:'女',campus:'园区校区',roles:'校区主管、招生',active:true}],config:{学科:[['语文',false,'语文'],['数学',true,'数学'],['英语',false,'英语'],['物理',true,'物理'],['化学',false,'化学'],['生物',false,'生物']],学期:[['春季',true,'春季'],['暑期',true,'暑期'],['秋季',true,'秋季'],['寒假',true,'寒假'],['全季',true,'全季']],年级:[['1年级',false,'1年级'],['2年级',false,'2年级'],['3年级',true,'3年级'],['4年级',true,'4年级'],['5年级',true,'5年级'],['6年级',true,'6年级']],班型:[['创新班',true,'大伟长班'],['尖子班',true,'校内拔高'],['提高班',true,'刷题班'],['X班',true,'S+班'],['Y班',true,'S班'],['Z班',true,'培优班']]}};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function heading(title,sub){return `<div class="heading"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div></div>`}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function render(){document.querySelectorAll('.menu-item').forEach(e=>e.classList.toggle('active',e.dataset.page===state.page));$('#crumb').textContent=({system:'分校配置',campus:'校区配置',teaching:'教学配置',staff:'员工管理'})[state.page]||'待设计';let html='';if(state.page==='system')html=systemPage();else if(state.page==='campus')html=campusPage();else if(state.page==='teaching')html=teachingPage();else if(state.page==='staff')html=staffPage();else html=heading('待设计页面','该模块已列入功能清单，等待详细业务规则和参考图。')+`<div class="card pad"><div class="empty">下一批原型将在这里展开</div></div>`;$('#view').innerHTML=html}
function systemPage(){return heading('分校配置','配置分校资料及业务规则')+`<div class="card"><div class="tabs"><button class="tab active">分校信息</button>${['考勤配置','调课配置','转班配置','进班配置'].map(x=>`<button class="tab" disabled title="功能清单标注为暂未开发">${x}</button>`).join('')}</div><div class="pad"><p class="notice">文档注明其余配置标签暂未开发，原型中以禁用状态展示。</p><h2 class="section-title">分校信息</h2><div class="form-grid"><div class="field"><label class="required">分校名称</label><input class="input" id="org-name" placeholder="请输入分校名称"></div><div class="field full"><label class="required">分校地址</label><div class="inline"><select class="select"><option value="" selected disabled>请选择省份</option><option>江苏省</option></select><select class="select"><option value="" selected disabled>请选择城市</option><option>苏州市</option></select></div></div></div><div class="form-actions"><button class="btn primary" onclick="toast('分校信息已保存（原型演示）')">保存</button></div></div></div>`}
function campusPage(){if(state.mode==='form')return campusForm();return heading('校区配置','管理校区、教室和坐席容量')+`<div class="card pad"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="state.mode='form';state.campusEdit=null;render()">新建</button><span class="count">校区总数：${state.campuses.length}</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>校区名称</th><th>教室总数</th><th>坐席总数</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.campuses.map((c,i)=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${c.rooms}</td><td>${c.seats}</td><td><span class="badge ${c.active?'':'off'}">${c.active?'已启用':'已停用'}</span></td><td><div class="actions"><a onclick="state.campusEdit=${i};state.mode='form';render()">编辑</a><a onclick="state.campuses[${i}].active=!state.campuses[${i}].active;render();toast('状态已更新')">${c.active?'停用':'启用'}</a></div></td></tr>`).join('')}</tbody></table></div></div>`}
function campusForm(){let c=state.campusEdit===null?null:state.campuses[state.campusEdit];return heading(c?'编辑校区':'创建校区','校区信息与教室信息')+`<div class="card pad"><h2 class="section-title">校区信息</h2><div class="form-grid"><div class="field"><label class="required">校区名称</label><input id="campus-name" class="input" maxlength="20" placeholder="请输入校区名称" value="${esc(c?.name||'')}"></div><div class="field full"><label class="required">校区地址</label><div class="inline"><select class="select"><option>江苏省</option></select><select class="select"><option>苏州市</option></select><select class="select"><option>姑苏区</option><option>工业园区</option><option>虎丘区</option></select></div></div><div class="field full"><input id="campus-address" class="input" placeholder="请输入详细地址" value="${esc(c?.address?.split(' ').slice(-1)[0]||'')}"></div><div class="field full"><label class="required">收款设置</label><select id="campus-merchant" class="select" style="max-width:430px"><option>苏州思跃教育科技有限公司</option><option>未绑定</option></select><div class="help">未绑定时，请前往“财务中心－收款设置”完成绑定。</div></div></div><div class="form-actions"><button class="btn" onclick="state.mode='list';render()">取消</button><button class="btn primary" onclick="saveCampus()">${c?'保存':'创建'}</button></div><hr class="divider"><div class="subcard-head"><h2 class="section-title" style="margin:0">教室信息</h2><button class="btn" onclick="addRoom()">+ 添加教室</button></div><div id="room-list">${c?`<div class="pill">现有教室 ${c.rooms} 间，坐席 ${c.seats} 个</div>`:'<div class="empty">尚未添加教室</div>'}</div></div>`}
function addRoom(){const list=$('#room-list');if(list.querySelector('.empty'))list.innerHTML='';list.insertAdjacentHTML('beforeend',`<div class="subcard room"><div class="subcard-head"><h3>新教室</h3><button class="btn small danger" onclick="this.closest('.room').remove()">移除</button></div><div class="form-grid"><div class="field"><label class="required">教室名称</label><input class="input room-name" placeholder="例如：A101"></div><div class="field"><label class="required">教室限额</label><input class="input room-capacity" type="number" min="1" placeholder="可容纳人数"></div><div class="field full"><label>教室地址</label><input class="input" placeholder="默认同校区地址，可修改"></div><div class="field full"><label>备注</label><textarea class="textarea" placeholder="选填"></textarea></div></div></div>`)}
function saveCampus(){const name=$('#campus-name').value.trim(),address=$('#campus-address').value.trim();if(!name||!address){toast('请填写校区名称和详细地址');return}let c=state.campusEdit===null?{name,rooms:0,seats:0,active:true}:{...state.campuses[state.campusEdit],name};c.address='江苏省 苏州市 姑苏区 '+address;c.merchant=$('#campus-merchant').value;document.querySelectorAll('.room').forEach(r=>{if(r.querySelector('.room-name').value.trim()){c.rooms++;c.seats+=Number(r.querySelector('.room-capacity').value)||0}});if(state.campusEdit===null)state.campuses.push(c);else state.campuses[state.campusEdit]=c;state.mode='list';render();toast('校区已保存')}
// 初始对外展示名称与条目名称一致，后续可单独编辑。
Object.values(state.config).forEach(rows=>rows.forEach(row=>{row[2]=row[0];row[3]=true}));
function teachingPage(){
  const tabs=['学科','学期','年级','班型'];
  if(!tabs.includes(state.tab))state.tab='学科';
  const type=state.tab,rows=state.config[type];
  if(state.mode==='teaching-edit')return teachingEditor();
  return heading('教学配置','配置课程和班级使用的基础字典')+`<div class="card">
    <div class="tabs">${tabs.map(t=>`<button class="tab ${type===t?'active':''}" onclick="state.tab='${t}';state.mode='list';render()">${t}配置</button>`).join('')}</div>
    <div class="pad"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="teachingNew()">新增${type}</button></div><span class="count">${rows.length} 项</span></div>
    <div class="table-wrap"><table class="config-table"><thead><tr><th>${type}</th><th>对外展示内容</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr><td>${esc(r[0])}</td><td>${r[1]?esc(r[2]):'<span class="muted">不展示</span>'}</td><td><span class="badge ${r[3]?'':'off'}">${r[3]?'已启用':'已停用'}</span></td><td><div class="actions"><button class="btn small" onclick="teachingEdit()">编辑</button><button class="btn small" onclick="teachingToggle(${i})">${r[3]?'停用':'启用'}</button><button class="btn small danger" onclick="teachingAskDelete(${i})">删除</button></div></td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">暂无${type}，点击“新增${type}”添加</div></td></tr>`}</tbody></table></div></div></div>
    ${state.mode==='teaching-new'?teachingNewDialog():state.mode==='teaching-delete'?teachingDeleteDialog():''}`;
}
function teachingEdit(){
  state.teachingRows=state.config[state.tab].map(row=>[...row]);
  state.mode='teaching-edit';render();
}
function teachingEditor(){
  const type=state.tab;
  return heading('编辑'+type+'配置','设置是否展示及对外展示内容')+`<div class="card pad"><form onsubmit="event.preventDefault();teachingSaveDisplay()"><div class="table-wrap"><table class="config-table teaching-display-table"><thead><tr><th>${type}</th><th>是否展示</th><th>对外展示内容</th></tr></thead><tbody>
    ${state.teachingRows.map((r,i)=>`<tr><td>${esc(r[0])}</td><td><label class="switch"><input type="checkbox" aria-label="展示${esc(r[0])}" ${r[1]?'checked':''} onchange="teachingSetVisible(${i},this.checked)"><span></span></label></td><td><div class="teaching-display-input"><input class="input" id="teaching-display-${i}" aria-label="${esc(r[0])}对外展示内容" maxlength="8" value="${esc(r[2])}" ${r[1]?'':'disabled'} oninput="teachingDisplayInput(${i},this.value)"><span class="teaching-display-count" id="teaching-count-${i}" ${r[1]?'':'hidden'}>${r[2].length}/8</span></div></td></tr>`).join('')}
    </tbody></table></div><div class="form-actions"><button type="button" class="btn" onclick="teachingClose()">取消</button><button type="submit" class="btn primary">保存</button></div></form></div>`;
}
function teachingSetVisible(index,visible){state.teachingRows[index][1]=visible;render()}
function teachingDisplayInput(index,value){
  if(!state.teachingRows[index][1])return;
  state.teachingRows[index][2]=value;
  $('#teaching-count-'+index).textContent=value.length+'/8';
}
function teachingSaveDisplay(){
  const rows=state.teachingRows.map(row=>[row[0],row[1],row[2].trim()||row[0],row[3]]);
  if(rows.some(row=>row[2].length>8)){toast('对外展示内容不能超过8个字');return}
  state.config[state.tab]=rows;teachingClose();toast(state.tab+'配置已保存');
}
function teachingNew(){
  state.teachingDraft={name:'',display:''};
  state.mode='teaching-new';render();$('#teaching-name')?.focus();
}
function teachingNewDialog(){
  const d=state.teachingDraft,title='新增'+state.tab;
  return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="teaching-dialog-title"><div class="modal-head"><h2 id="teaching-dialog-title">${title}</h2><button class="btn small" aria-label="关闭" onclick="teachingClose()">✕</button></div>
    <form onsubmit="event.preventDefault();teachingSave()"><div class="form-grid"><div class="field"><label class="required" for="teaching-name">${state.tab}名称</label><input class="input" id="teaching-name" maxlength="8" value="${esc(d.name)}" placeholder="请输入${state.tab}名称" oninput="teachingNameInput(this.value)"></div>
    <div class="field"><label for="teaching-display">对外展示内容</label><input class="input" id="teaching-display" maxlength="8" value="${esc(d.display)}" placeholder="默认与${state.tab}名称一致" oninput="state.teachingDraft.display=this.value"><div class="help">可单独修改，留空时使用${state.tab}名称。</div></div></div>
    <div class="modal-actions"><button type="button" class="btn" onclick="teachingClose()">取消</button><button type="submit" class="btn primary">保存</button></div></form></div></div>`;
}
function teachingNameInput(value){
  const d=state.teachingDraft;
  if(!d.display.trim()||d.display===d.name){d.display=value;$('#teaching-display').value=value}
  d.name=value;
}
function teachingSave(){
  const d=state.teachingDraft,rows=state.config[state.tab],name=d.name.trim(),display=d.display.trim()||name;
  if(!name){toast('请输入'+state.tab+'名称');return}
  if(name.length>8||display.length>8){toast('名称和对外展示内容不能超过8个字');return}
  if(rows.some(row=>row[0]===name)){toast(state.tab+'名称已存在');return}
  rows.push([name,true,display,true]);
  teachingClose();toast(state.tab+'已保存');
}
function teachingClose(){state.mode='list';state.teachingDraft=null;state.teachingRows=null;state.teachingDeleteIndex=null;render()}
function teachingToggle(index){const row=state.config[state.tab][index];row[3]=!row[3];render();toast(state.tab+(row[3]?'已启用':'已停用'))}
function teachingAskDelete(index){state.teachingDeleteIndex=index;state.mode='teaching-delete';render()}
function teachingDeleteDialog(){
  const row=state.config[state.tab][state.teachingDeleteIndex];
  return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="teaching-delete-title"><div class="modal-head"><h2 id="teaching-delete-title">删除${state.tab}</h2></div><p>确定删除${state.tab}“${esc(row[0])}”吗？</p><div class="modal-actions"><button class="btn" onclick="teachingClose()">取消</button><button class="btn danger" onclick="teachingDelete()">确认删除</button></div></div></div>`;
}
function teachingDelete(){state.config[state.tab].splice(state.teachingDeleteIndex,1);teachingClose();toast(state.tab+'已删除')}
function staffPage(){if(state.mode==='form')return staffForm();return heading('员工管理','管理员工资料、管辖校区与模块权限')+`<div class="card pad"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="state.mode='form';state.staffEdit=null;render()">+ 创建员工</button></div><div class="toolbar-right"><button class="btn" onclick="toast('导入模板待业务确认')">导入员工</button><button class="btn" onclick="toast('导出功能待业务确认')">导出</button></div></div><div class="filters"><select class="select"><option>全部校区</option><option>城中校区</option><option>园区校区</option></select><select class="select"><option>全部职位</option><option>教务</option><option>招生</option></select><input class="input" placeholder="搜索姓名、电话或邮箱"><select class="select"><option>已启用</option><option>全部状态</option><option>已禁用</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>联系电话</th><th>性别</th><th>所属校区</th><th>用户职位</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.staff.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.gender)}</td><td>${esc(s.campus)}</td><td>${esc(s.roles)}</td><td><span class="badge ${s.active?'':'off'}">${s.active?'已启用':'已禁用'}</span></td><td><div class="actions"><a onclick="state.staffEdit=${i};state.mode='form';render()">详情 / 编辑</a><a onclick="state.staff[${i}].active=!state.staff[${i}].active;render()">${s.active?'禁用':'启用'}</a></div></td></tr>`).join('')}</tbody></table></div></div>`}
function staffForm(){let s=state.staffEdit===null?null:state.staff[state.staffEdit];return heading(s?'编辑员工':'创建员工','填写基本信息并配置校区、职位与权限')+`<div class="card pad"><h2 class="section-title">基本信息</h2><div class="form-grid"><div class="field"><label class="required">姓名</label><input id="staff-name" class="input" placeholder="请输入姓名" value="${esc(s?.name||'')}"></div><div class="field"><label class="required">手机号（用于登录）</label><input id="staff-phone" class="input" placeholder="请输入手机号码" value="${esc(s?.phone||'')}"><div class="help">手机号将作为登录账号。</div></div><div class="field"><label>性别</label><select id="staff-gender" class="select"><option>男</option><option ${s?.gender==='女'?'selected':''}>女</option></select></div><div class="field"><label>员工头像</label><input type="file" accept="image/png,image/jpeg" class="input"><div class="help">支持 JPG、PNG，文件不超过 2MB。</div></div></div><hr class="divider"><h2 class="section-title">管辖校区</h2><div class="checkrow"><label><input type="radio" name="campus-scope" checked> 全部校区</label><label><input type="radio" name="campus-scope"> 指定校区</label></div><h2 class="section-title">职位管理</h2><div class="checkrow">${['校区主管','财务','教务','前台','招生','学管师','课程顾问','教学管理','面授（直播）主讲'].map(x=>`<label><input type="checkbox" class="role" value="${x}" ${s?.roles?.includes(x)?'checked':''}> ${x}</label>`).join('')}</div><h2 class="section-title">模块权限</h2>${[['线索与业务','线索查看','线索分配','报名','转课/班','退课/班'],['教务中心','学生管理','课程管理','班级管理','课表','考勤','缺勤管理'],['财务中心','收费订单','欠费记录','退转记录','收款设置'],['基础设置','校区配置','教学配置','员工管理']].map(g=>`<div class="permission-block"><h3>${g[0]}</h3><div class="checkrow">${g.slice(1).map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></div>`).join('')}<div class="form-actions"><button class="btn" onclick="state.mode='list';render()">取消</button><button class="btn primary" onclick="saveStaff()">${s?'保存':'创建'}</button></div></div>`}
function saveStaff(){let name=$('#staff-name').value.trim(),phone=$('#staff-phone').value.trim();if(!name||!phone){toast('请填写姓名和手机号');return}let roles=[...document.querySelectorAll('.role:checked')].map(x=>x.value).join('、')||'未配置';let s={name,phone,gender:$('#staff-gender').value,campus:'全部校区',roles,active:true};if(state.staffEdit===null)state.staff.push(s);else state.staff[state.staffEdit]={...state.staff[state.staffEdit],...s};state.mode='list';render();toast('员工信息已保存')}
document.querySelectorAll('.menu-item').forEach(e=>e.addEventListener('click',()=>{state.page=e.dataset.page;state.mode='list';state.editing=false;render()}));render();
</script>
